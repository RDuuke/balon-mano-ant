schema: flow-nea

context: |
  Stack actual: no hay WordPress, PHP ni dependencias inicializadas en el repositorio.
  Fuente funcional: website-liga-antioquena-wordpress.md.
  Arquitectura objetivo: WordPress con tema propio y plugin para funcionalidad persistente.
  Pruebas: no existe infraestructura de pruebas todavía.
  Estilo: WordPress Coding Standards, Gutenberg, accesibilidad WCAG 2.2 AA y contenido en español.

rules:
  proposal:
    - Incluir plan de reversión para cambios riesgosos
    - Identificar módulos o paquetes afectados
  specs:
    - Usar formato Dado/Cuando/Entonces para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Documentar decisiones de arquitectura y su justificación
  tasks:
    - Agrupar tareas por fase
    - Usar numeración jerárquica (1.1, 1.2, etc.)
  apply:
    - Seguir los patrones y convenciones existentes del código
  verify:
    - Ejecutar pruebas si existe infraestructura de pruebas
  archive:
    - Advertir antes de fusiones destructivas

gates:
  apply:
    tdd: 'strict'
    review_budget:
      max_diff_lines: 0
      sensitive_paths: []
  verify:
    coverage_threshold: 80

experimental:
  neabrain: false
