schema: flow-nea

context: |
  Stack actual: WordPress 6.8+, PHP 8.3+, tema de bloques LABM y plugin labm-core.
  Frontend: patrones Gutenberg y CSS del tema en wp-content/themes/labm.
  Funcionalidad persistente: plugin wp-content/plugins/labm-core.
  Pruebas: PHPUnit, PHPStan/WPCS y Playwright con pruebas de accesibilidad.
  Estilo: WordPress Coding Standards, Gutenberg, WCAG 2.2 AA y contenido en español.

rules:
  proposal:
    - Incluir plan de reversión para cambios riesgosos
    - Identificar módulos o paquetes afectados
  specs:
    - Usar formato Dado/Cuando/Entonces para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Documentar decisiones de arquitectura y su justificación
  tasks:
    - Agrupar tareas por fase
    - Usar numeración jerárquica (1.1, 1.2, etc.)
  apply:
    - Seguir los patrones y convenciones existentes del código
  verify:
    - Ejecutar pruebas si existe infraestructura de pruebas
  archive:
    - Advertir antes de fusiones destructivas

gates:
  apply:
    tdd: 'strict'
    review_budget:
      max_diff_lines: 0
      sensitive_paths: []
  verify:
    coverage_threshold: 80

experimental:
  neabrain: false
